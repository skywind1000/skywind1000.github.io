<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="한국 주식 데이터 리포트">
  <!-- 기준선 위로 오르고 아래로 내리는 세 막대.
       국내 증시 관습대로 오름이 빨강, 내림이 파랑입니다 — 사이트가 글 안에서
       쓰는 색과 같아, 마크가 곧 읽는 법의 안내가 됩니다.
       기준선을 **먼저** 그려 막대 뒤로 보냅니다. 위에 그리면 막대를 가로질러
       겹치는 자리가 탁해집니다. -->
  <rect x="2" y="15.5" width="28" height="1" rx=".5" fill="#1a1a1a" opacity=".3"/>
  <rect x="4"  y="5"  width="7" height="11" rx="1.5" fill="#c0392b"/>
  <rect x="14" y="16" width="7" height="9"  rx="1.5" fill="#2a63b0"/>
  <rect x="24" y="10" width="6" height="6"  rx="1.5" fill="#c0392b"/>
</svg>
