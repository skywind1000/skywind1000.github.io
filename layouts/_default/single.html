{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006년 1월 2일" }}</time>
      {{ range .Params.categories }}<span class="post-category">{{ . }}</span>{{ end }}
    </p>
  </header>

  <div class="post-body">
    {{ .Content }}
  </div>

  {{ partial "adsense-slot.html" . }}
</article>
{{ end }}
