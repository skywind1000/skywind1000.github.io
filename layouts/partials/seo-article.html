<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05-07:00" | jsonify }},
  "dateModified": {{ (.Lastmod | default .Date).Format "2006-01-02T15:04:05-07:00" | jsonify }},
  "description": {{ (.Description | default .Site.Params.description) | jsonify }},
  "author": { "@type": "Organization", "name": {{ .Site.Title | jsonify }} },
  "publisher": { "@type": "Organization", "name": {{ .Site.Title | jsonify }} },
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ .Permalink | jsonify }} }
}
</script>
