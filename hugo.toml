
baseURL = "https://skywind1000.github.io/"
locale = "ko"
title = "한국 주식 데이터 리포트"
paginate = 10
enableRobotsTXT = true
summarylength = 60
copyright = "이 사이트의 표·차트·통계는 자체 수집 데이터베이스에서 생성됩니다."

[params]
  description = "KOSPI·KOSDAQ 전 종목 데이터를 매일 수집해 만드는 통계 리포트입니다."
  # 카드/공유 미리보기에 쓸 기본 이미지가 없다면 빈 문자열로 둡니다.
  defaultImage = ""

  [params.adsense]
    # AdSense 심사 통과 후 발급받은 pub-XXXXXXXXXXXXXXXX 를 넣으면
    # layouts/partials/adsense.html 이 자동으로 스크립트를 삽입합니다.
    # 빈 문자열이면 아무것도 렌더링하지 않습니다.
    client = ""

  [params.verification]
    # Google Search Console 소유권 확인용 토큰.
    #
    # search.google.com/search-console 에서 "URL 접두어" 방식으로
    # https://skywind1000.github.io/ 를 등록하면, 확인 방법 중 "HTML 태그" 에서
    #     <meta name="google-site-verification" content="AbCdEf...">
    # 를 줍니다. 태그 전체가 아니라 **따옴표 안의 값만** 여기 넣고 push 하면
    # 모든 페이지 <head> 에 태그가 붙습니다. 빈 문자열이면 아무것도 넣지 않습니다.
    #
    # 확인이 끝난 뒤에도 지우면 안 됩니다 — 구글이 주기적으로 다시 확인하고,
    # 태그가 사라지면 소유권이 해제됩니다.
    google = ""

[taxonomies]
  category = "categories"
  tag = "tags"

[sitemap]
  changefreq = "daily"
  priority = 0.5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 데이터 표에 배당수익률 같은 각주성 표기를 그대로 쓰기 위해 raw HTML 허용
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[menu]
  [[menu.main]]
    name = "홈"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "전체 글"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "소개"
    url = "/about/"
    weight = 3
  [[menu.main]]
    name = "개인정보처리방침"
    url = "/privacy/"
    weight = 4
  [[menu.main]]
    name = "문의"
    url = "/contact/"
    weight = 5
