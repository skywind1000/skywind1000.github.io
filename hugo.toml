
baseURL = "https://skywind.kr/"
locale = "ko"
title = "한국 주식 데이터 리포트"
paginate = 10
enableRobotsTXT = true
summarylength = 60
copyright = "이 사이트의 표·차트·통계는 자체 수집 데이터베이스에서 생성됩니다."

[params]
  description = "KOSPI·KOSDAQ 전 종목 데이터를 매일 수집해 만드는 통계 리포트입니다."
  # 카드/공유 미리보기에 쓸 기본 이미지가 없다면 빈 문자열로 둡니다.
  defaultImage = ""

  [params.adsense]
    # 게시자 ID (pub-XXXXXXXXXXXXXXXX). 넣고 push 하면
    # partials/adsense-head.html 과 adsense-slot.html 이 코드를 삽입합니다.
    # 빈 문자열이면 아무것도 렌더링하지 않습니다.
    #
    # **승인 전에 넣어야 합니다.** 순서가 헷갈리기 쉬운데, 게시자 ID 는
    # 가입할 때 나오고 심사는 그 코드가 사이트에 올라가 있어야 시작됩니다.
    # "승인되면 넣어야지" 하고 비워 두면 심사가 영영 시작되지 않습니다.
    #
    #   1. AdSense 가입 → 사이트로 skywind.kr 추가
    #   2. 게시자 ID 발급 (여기 넣고 push)
    #   3. AdSense 에서 "검토 요청"
    #   4. 승인 또는 반려 (보통 며칠 ~ 2주)
    #
    # 심사를 기다리는 동안에는 광고 자리가 빈 채로 보입니다 — 정상입니다.
    client = ""

  [params.verification]
    # Google Search Console 소유권 확인용 토큰.
    #
    # search.google.com/search-console 에서 "URL 접두어" 방식으로
    # https://skywind.kr/ 를 등록하면, 확인 방법 중 "HTML 태그" 에서
    #     <meta name="google-site-verification" content="AbCdEf...">
    # 를 줍니다. 태그 전체가 아니라 **따옴표 안의 값만** 여기 넣고 push 하면
    # 모든 페이지 <head> 에 태그가 붙습니다. 빈 문자열이면 아무것도 넣지 않습니다.
    #
    # 확인이 끝난 뒤에도 지우면 안 됩니다 — 구글이 주기적으로 다시 확인하고,
    # 태그가 사라지면 소유권이 해제됩니다.
    google = ""

# 태그(tag)는 쓰지 않으므로 켜 두지 않습니다. 켜 두면 글이 하나도 없는
# /tags/ 페이지가 생기고 사이트맵에까지 올라가, 본문이 "Tags" 네 글자뿐인
# 빈 페이지를 색인해 달라고 구글에 알리는 꼴이 됩니다.
[taxonomies]
  category = "categories"

[sitemap]
  changefreq = "daily"
  priority = 0.5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 데이터 표에 배당수익률 같은 각주성 표기를 그대로 쓰기 위해 raw HTML 허용
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[menu]
  [[menu.main]]
    name = "홈"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "전체 글"
    url = "/posts/"
    weight = 2
  # 상설 페이지 — 날짜순 글이 아니라 같은 주소를 갱신하는 참고 자료입니다.
  [[menu.main]]
    name = "계절성"
    url = "/seasonality/"
    weight = 3
  [[menu.main]]
    name = "소개"
    url = "/about/"
    weight = 4
  [[menu.main]]
    name = "개인정보처리방침"
    url = "/privacy/"
    weight = 5
  [[menu.main]]
    name = "문의"
    url = "/contact/"
    weight = 6
