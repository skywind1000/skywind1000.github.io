name: Hugo 사이트 빌드·배포

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # 글 머리말의 date 가 그날 16:10 이라, 그 전에 push 하면 이 빌드는 미래 날짜 글을
  # 빼고 배포합니다(hugo 기본값, buildFuture 꺼짐). 2026-10-06 에 그렇게 글이 404
  # 였고, 16:10 뒤 배포를 손으로 다시 돌려야 했습니다. 평일 16:15 KST(07:15 UTC)에
  # 한 번 더 빌드해 그런 글이 저절로 올라오게 합니다. GitHub 예약 실행은 몇 분씩
  # 늦게 뜰 수 있습니다.
  schedule:
    - cron: "15 7 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.165.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Hugo 설치
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb

      - name: Pages 설정
        id: pages
        uses: actions/configure-pages@v5

      # baseURL 은 hugo.toml 값을 씁니다. configure-pages 가 주는 base_url 은
      # **Enforce HTTPS 를 켜기 전까지 http:// 를 반환합니다.** 실제로 그 값으로
      # 빌드했더니 canonical 과 사이트맵이 전부 http://skywind.kr 로 나갔습니다.
      # 검색엔진에 넘기는 정본 주소가 설정 화면의 체크박스 상태에 따라 달라지면
      # 안 되므로, 주소는 hugo.toml 한 곳에서만 정합니다.
      - name: 빌드
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
